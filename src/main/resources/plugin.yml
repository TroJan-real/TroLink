name: TroLink
version: '1.2.0'
main: com.trolink.plugin.TroLink
api-version: '1.21'
author: TroJan_real
description: Discord-Minecraft Hesap Eşleme Eklentisi
depend: [LuckPerms]
softdepend: [Vault, PlaceholderAPI]

commands:
  hesapesle:
    description: Discord hesabınızı bağlar.
    aliases: [link, verify]
  hesapkaldir:
    description: Discord bağlantısını kaldırır.
    aliases: [unlink]
  hesapdurum:
    description: Bağlantı durumunu gösterir.
    aliases: [status]
  trolink:
    description: Ana admin komutu.
    permission: trolink.admin

permissions:
  trolink.admin:
    description: Tüm admin komutlarını kullanma yetkisi.
    default: op
